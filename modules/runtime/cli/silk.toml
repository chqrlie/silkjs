[package]
name = "silkjsruntime-cli"
description = "The silkjsruntime executable: the runtime with the real implementation of every capability"
version = "0.1.0"
silk-version = "0.1.0-dev.78+e02346fdb3aa"

[dependencies]
silkjs = { path = "../../engine" }
silkjsruntime = { path = ".." }
wasm = { path = "../wamr", package = "silkjsruntime-wamr" }
compress = { path = "../compress", package = "silkjsruntime-compress" }
# Compression over silk.compress, for src/main_silk.silk.
silkcompress = { path = "../silkcompress", package = "silkjsruntime-silkcompress" }
# The HTTP/1 parser in Silk, for src/main_silk.silk.
silkhttp = { path = "../silkhttp", package = "silkjsruntime-silkhttp" }
http2 = { path = "../http2", package = "silkjsruntime-nghttp2" }
http = { path = "../llhttp", package = "silkjsruntime-llhttp" }
database = { path = "../sqlite", package = "silkjsruntime-sqlite" }
openssl = { path = "../openssl", package = "silkjsruntime-openssl" }
inspector = { path = "../inspector", package = "silkjsruntime-inspector" }
amaro = { path = "../amaro", package = "silkjsruntime-amaro" }
addons = { path = "../napi", package = "silkjsruntime-napi" }
# The package manager: `silkjsruntime install` and the other commands.
pm = { path = "../../pm" }
