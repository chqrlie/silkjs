[package]
name = "silkjsruntime-wamr"
description = "WebAssembly and WASI for the SilkJS runtime, over WAMR: the real implementation of its Wasm capability"
version = "0.1.0"
silk-version = "0.1.0-dev.78+e02346fdb3aa"
kind = "library"
# `wamr` is WamrWasm.
exports = ["wamr"]

[dependencies]
silkjs = { path = "../../engine" }
silkjsruntime = { path = ".." }
# WAMR and SIMDe, compiled into a program only when it depends on this package.
wamrnative = { path = "../../native/wamr", package = "silkjs-wamr" }
# uvwasi and the libuv it builds on, for WASI.
libuv = { path = "../../native/libuv", package = "silkjs-libuv" }
