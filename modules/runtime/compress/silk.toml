[package]
name = "silkjsruntime-compress"
description = "Compression for the SilkJS runtime, over zlib, zstd and brotli: the real implementation of its Compression capability"
version = "0.1.0"
silk-version = "0.1.0-dev.78+e02346fdb3aa"
kind = "library"
# `compress` is NativeCompression.
exports = ["compress"]

[dependencies]
silkjs = { path = "../../engine" }
silkjsruntime = { path = ".." }
# zlib, zstd and brotli, compiled into a program only when it depends on this package.
zlib = { path = "../../native/zlib", package = "silkjs-zlib" }
zstd = { path = "../../native/zstd", package = "silkjs-zstd" }
brotli = { path = "../../native/brotli", package = "silkjs-brotli" }
