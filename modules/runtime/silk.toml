[package]
name = "silkjsruntime"
version = "0.1.0"
# The embedding API (src/runtime/embed.silk), the loop it turns, and the hook for an embedder's own
# native functions (src/libs/core/embedder.silk). src/main.silk is the
# executable, the first embedder; src/embed_smoke.silk is the embedding API's smoke test.
exports = ["runtime.embed", "runtime.session", "libs.core.embedder", "libs.core.host", "embed_smoke"]
silk-version = "0.1.0-dev.74+205aea3f5b2e"

[dependencies]
# The engine, from this repository's modules/engine.
silkjs = { path = "../engine" }
# The package manager, from this repository's modules/pm: `silkjsruntime install` and the other commands.
pm = { path = "../pm" }
# SQLite 3 compiled from the amalgamation that silk-lang/lib-sqlite pins, with the features Node builds.
sqlite = { git = "https://github.com/silk-lang/lib-sqlite", rev = "b633d162c209a41547c5a0ea3a96098eff2e20bb", package = "db-sqlite" }
# The C libraries Node builds with, each compiled by Silk from its pinned release (../native).
libuv = { path = "../native/libuv", package = "silkjs-libuv" }
openssl = { path = "../native/openssl", package = "silkjs-openssl" }
nghttp2 = { path = "../native/nghttp2", package = "silkjs-nghttp2" }
zlib = { path = "../native/zlib", package = "silkjs-zlib" }
zstd = { path = "../native/zstd", package = "silkjs-zstd" }
brotli = { path = "../native/brotli", package = "silkjs-brotli" }
# WAMR, behind WebAssembly and WASI (../native/wamr).
wamr = { path = "../native/wamr", package = "silkjs-wamr" }

# The runtime's own C. builtin_sources.c embeds the built-in JavaScript (tools/embed.py).
# tools/build.py links the executable with the built-ins' bytecode and a build identity besides.
[native]
sources = [
  { c = "builtin_sources.c", flags = ["-std=c23", "-O2", "-w"] },
  { c = "src/ext/builtin_cache.c", flags = ["-std=gnu23", "-O2", "-w"] },
  { c = "src/ext/inspector_transport.c", flags = ["-std=gnu11", "-O2", "-w"] },
  { c = ["vendor/llhttp/src/llhttp.c", "vendor/llhttp/src/http.c", "src/ext/http_parser_bridge.c"], include = ["vendor/llhttp/include"], flags = ["-std=gnu11", "-O2", "-w"] },
  { c = "vendor/llhttp/src/api.c", include = ["vendor/llhttp/include"], flags = ["-std=gnu11", "-O2", "-w", "-Dllhttp__on_message_begin=silk_llhttp_base_on_message_begin", "-Dllhttp__on_header_value_complete=silk_llhttp_base_on_header_value_complete", "-Dllhttp__on_headers_complete=silk_llhttp_base_on_headers_complete", "-Dllhttp__on_message_complete=silk_llhttp_base_on_message_complete", "-Dllhttp__on_chunk_header=silk_llhttp_base_on_chunk_header", "-Dllhttp__on_chunk_complete=silk_llhttp_base_on_chunk_complete"] },
]
link = [
  { library = "pthread", mode = "dynamic", os = "linux" },
  { library = "dl", mode = "dynamic", os = "linux" },
  { library = "m", mode = "dynamic", os = "linux" },
]


[[generate]]
run = ["tools/embed.py"]
outputs = ["builtin_sources.c", "src/runtime/embedded.silk"]
