[package]
name = "silkjsruntime"
version = "0.1.0"
# The runtime's core (docs/composable-runtime.md): the embedding API (src/runtime/embed.silk), the
# loop it turns, and the capabilities an embedder chooses (src/libs/core/capabilities.silk). The
# real Wasm capability is ./wamr, the real Compression ./compress, the real Http2 ./http2, the real Http ./llhttp, the real Database ./sqlite, the real Crypto and Tls ./openssl; the executable, which provides every real one, is ./cli.
# src/embed_smoke.silk is the embedding API's smoke test, here without WebAssembly.
exports = ["runtime.embed", "runtime.session", "runtime.worker", "libs.core.capabilities", "libs.core.module_sources", "libs.core.platforms", "libs.core.files", "libs.core.host", "libs.core.common",
  "libs.core.owners", "ext.diagnostics_fatal", "ext.library_hooks", "ext.fs_async", "ext.blocking_pool", "ext.resource_snapshot", "ext.vm_native", "ext.keep_exports", "ext.napi_async", "ext.napi_core", "ext.napi_values", "embed_smoke"]
kind = "library"
silk-version = "0.1.0-dev.78+e02346fdb3aa"

[dependencies]
# The engine, from this repository's modules/engine.
silkjs = { path = "../engine" }
# The C libraries Node builds with, each compiled by Silk from its pinned release (../native).
libuv = { path = "../native/libuv", package = "silkjs-libuv" }

# The runtime's own C. builtin_sources.c embeds the built-in JavaScript (tools/embed.py).
# tools/build.py links the executable with the built-ins' bytecode and a build identity besides.
[native]
sources = [
  { c = "builtin_sources.c", flags = ["-std=c23", "-O2", "-w"] },
  { c = "src/ext/builtin_cache.c", flags = ["-std=gnu23", "-O2", "-w"] },
  { c = "src/ext/inspector_transport.c", flags = ["-std=gnu11", "-O2", "-w"] },
]
link = [
  { library = "pthread", mode = "dynamic", os = "linux" },
  { library = "dl", mode = "dynamic", os = "linux" },
  { library = "m", mode = "dynamic", os = "linux" },
]

[[generate]]
run = ["tools/embed.py"]
outputs = ["builtin_sources.c", "src/runtime/embedded.silk"]
