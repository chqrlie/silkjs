[package]
name = "silkjs-runtime"
version = "0.1.0"
# The embedding API (src/runtime/embed.silk), the loop it turns, and the hook for an embedder's own
# native functions (src/libs/core/embedder.silk). src/main.silk is the
# executable, the first embedder; src/embed_smoke.silk is the embedding API's smoke test.
exports = ["runtime.embed", "runtime.session", "libs.core.embedder", "libs.core.host", "embed_smoke"]
silk-version = "0.1.0-pipeline.1"

[dependencies]
benchkit = { path = "../benchkit" }
# The engine, from this repository's modules/engine.
silkjs = { path = "../engine", package = "silkjs-engine" }
# The package manager, from this repository's modules/pm: `silkjs install` and the other commands.
pm = { path = "../pm" }
# SQLite 3 compiled from the amalgamation that silk-lang/lib-sqlite pins, with the features Node builds.
sqlite = { git = "https://github.com/silk-lang/lib-sqlite", rev = "8f6b73488be824d97ce1a1c02a9484a2209521e3", package = "db-sqlite" }
# The C libraries Node builds with, each compiled by Silk from its pinned release (../native).
# uvwasi only: it is compiled against a uv.h whose functions src/ext/uvwasi_host.silk defines. No libuv.
uvwasi = { path = "../native/uvwasi", package = "silkjs-uvwasi" }
openssl = { path = "../native/openssl", package = "silkjs-openssl" }
nghttp2 = { path = "../native/nghttp2", package = "silkjs-nghttp2" }
zstd = { path = "../native/zstd", package = "silkjs-zstd" }
brotli = { path = "../native/brotli", package = "silkjs-brotli" }

# The benchmark tasks (bench/README.md) are written with the package of ../benchkit.
[native.archive.silkjs-simde]
url = "https://codeload.github.com/simd-everywhere/simde/tar.gz/71fd833d9666141edcd1d3c109a80e228303d8d7"
sha256 = "72b2c14a487560b7eb203795f2c2fead5c7499662e639944cca2a9bb19f09029"
strip = 1
