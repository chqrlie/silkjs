[package]
name = "silkjs-runtime-sqlite"
description = "node:sqlite and localStorage for the SilkJS runtime, over SQLite: the real implementation of its Database capability"
version = "0.1.0"
silk-version = "0.1.0-dev.88+17d1a1b4d501"
kind = "library"
# `sqlite_database` is SqliteDatabase.
exports = ["sqlite_database"]

[dependencies]
silkjs = { path = "../../engine", package = "silkjs-engine" }
silkjsruntime = { path = "..", package = "silkjs-runtime" }
# SQLite 3 compiled from the amalgamation that silk-lang/lib-sqlite pins, with the features Node builds.
sqlite = { git = "https://github.com/silk-lang/lib-sqlite", rev = "680dbcf5a49603966bb813007480f8803f4b1556", package = "db-sqlite" }
