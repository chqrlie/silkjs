[package]
name = "silkjs-runtime-silkcompress"
description = "Compression for the SilkJS runtime over silk.compress, with no C library: an implementation of its Compression capability"
version = "0.1.0"
silk-version = "0.1.0-dev.86+c9d19330761b"
kind = "library"
# `silk_compression` is SilkCompression.
exports = ["silk_compression"]

[dependencies]
silkjs = { path = "../../engine", package = "silkjs-engine" }
silkjsruntime = { path = "..", package = "silkjs-runtime" }
