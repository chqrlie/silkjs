[package]
name = "silkjs-wamr"
description = "WAMR, the WebAssembly interpreter behind the SilkJS runtime's WebAssembly and WASI, with SIMDe"
version = "2.4.5"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["lib"]

# vendor/ is WAMR at its pinned commit with vendor/patches applied, reduced to what builds
# (tools/vendor_wamr.py writes it: Silk can fetch an archive but not patch it). glue/ is the
# runtime's C over WAMR's API (silk_wamr.h), which src/ext/wamr_abi.silk in the runtime binds.
[native]
sources = [
  { c = [
    "vendor/core/shared/platform/common/posix/posix_blocking_op.c",
    "vendor/core/shared/platform/common/posix/posix_malloc.c",
    "vendor/core/shared/platform/common/posix/posix_memmap.c",
    "vendor/core/shared/platform/common/posix/posix_sleep.c",
    "vendor/core/shared/platform/common/posix/posix_thread.c",
    "vendor/core/shared/platform/common/posix/posix_time.c",
    "vendor/core/shared/mem-alloc/ems/ems_alloc.c",
    "vendor/core/shared/mem-alloc/ems/ems_gc.c",
    "vendor/core/shared/mem-alloc/ems/ems_hmu.c",
    "vendor/core/shared/mem-alloc/ems/ems_kfc.c",
    "vendor/core/shared/mem-alloc/mem_alloc.c",
    "vendor/core/shared/utils/bh_assert.c",
    "vendor/core/shared/utils/bh_bitmap.c",
    "vendor/core/shared/utils/bh_common.c",
    "vendor/core/shared/utils/bh_hashmap.c",
    "vendor/core/shared/utils/bh_leb128.c",
    "vendor/core/shared/utils/bh_list.c",
    "vendor/core/shared/utils/bh_log.c",
    "vendor/core/shared/utils/bh_queue.c",
    "vendor/core/shared/utils/bh_vector.c",
    "vendor/core/shared/utils/runtime_timer.c",
    "vendor/core/iwasm/common/wasm_application.c",
    "vendor/core/iwasm/common/wasm_blocking_op.c",
    "vendor/core/iwasm/common/wasm_c_api.c",
    "vendor/core/iwasm/common/wasm_exec_env.c",
    "vendor/core/iwasm/common/wasm_loader_common.c",
    "vendor/core/iwasm/common/wasm_memory.c",
    "vendor/core/iwasm/common/wasm_native.c",
    "vendor/core/iwasm/common/wasm_runtime_common.c",
    "vendor/core/iwasm/common/wasm_shared_memory.c",
    "vendor/core/iwasm/interpreter/wasm_interp_classic.c",
    "vendor/core/iwasm/interpreter/wasm_loader.c",
    "vendor/core/iwasm/interpreter/wasm_runtime.c",
    "vendor/core/iwasm/common/gc/gc_common.c",
    "vendor/core/iwasm/common/gc/gc_object.c",
    "vendor/core/iwasm/common/gc/gc_type.c",
    "vendor/core/shared/platform/linux/platform_init.c",
    "vendor/invoke_native.c",
    "glue/*.c",
  ], include = ["vendor/core/iwasm/interpreter", "vendor/core/iwasm/common/gc", "silkjs-simde:", "vendor/core/iwasm/include", "vendor/core/shared/platform/linux", "vendor/core/shared/platform/include", "vendor/core/shared/mem-alloc", "vendor/core/iwasm/common", "vendor/core/shared/utils", "glue"], flags = ["-std=gnu11", "-O2", "-w", "-DNDEBUG", "-DBH_ENABLE_GC_CORRUPTION_CHECK=0", "-DBH_FREE=wasm_runtime_free", "-DBH_MALLOC=wasm_runtime_malloc", "-DWASM_DISABLE_HW_BOUND_CHECK=1", "-DWASM_DISABLE_STACK_HW_BOUND_CHECK=1", "-DWASM_DISABLE_WAKEUP_BLOCKING_OP=0", "-DWASM_DISABLE_WRITE_GS_BASE=0", "-DWASM_ENABLE_AOT_INTRINSICS=0", "-DWASM_ENABLE_BULK_MEMORY=1", "-DWASM_ENABLE_CUSTOM_NAME_SECTION=1", "-DWASM_ENABLE_EXCE_HANDLING=1", "-DWASM_ENABLE_EXTENDED_CONST_EXPR=1", "-DWASM_ENABLE_FAST_INTERP=0", "-DWASM_ENABLE_GC=1", "-DWASM_ENABLE_INTERP=1", "-DWASM_ENABLE_LOAD_CUSTOM_SECTION=1", "-DWASM_ENABLE_MEMORY64=1", "-DWASM_ENABLE_MINI_LOADER=0", "-DWASM_ENABLE_MULTI_MEMORY=1", "-DWASM_ENABLE_MULTI_MODULE=1", "-DWASM_ENABLE_QUICK_AOT_ENTRY=0", "-DWASM_ENABLE_REF_TYPES=1", "-DWASM_ENABLE_SHARED_MEMORY=1", "-DWASM_ENABLE_SHRUNK_MEMORY=1", "-DWASM_ENABLE_SIMD=1", "-DWASM_ENABLE_SIMDE=1", "-DWASM_ENABLE_TAGS=1", "-DWASM_ENABLE_TAIL_CALL=1", "-DWASM_GLOBAL_HEAP_SIZE=10485760", "-DBH_PLATFORM_LINUX", "-DWASM_HAVE_MREMAP=1", "-D_GNU_SOURCE"], os = "linux" },
  { c = [
    "vendor/core/shared/platform/common/posix/posix_blocking_op.c",
    "vendor/core/shared/platform/common/posix/posix_malloc.c",
    "vendor/core/shared/platform/common/posix/posix_memmap.c",
    "vendor/core/shared/platform/common/posix/posix_sleep.c",
    "vendor/core/shared/platform/common/posix/posix_thread.c",
    "vendor/core/shared/platform/common/posix/posix_time.c",
    "vendor/core/shared/mem-alloc/ems/ems_alloc.c",
    "vendor/core/shared/mem-alloc/ems/ems_gc.c",
    "vendor/core/shared/mem-alloc/ems/ems_hmu.c",
    "vendor/core/shared/mem-alloc/ems/ems_kfc.c",
    "vendor/core/shared/mem-alloc/mem_alloc.c",
    "vendor/core/shared/utils/bh_assert.c",
    "vendor/core/shared/utils/bh_bitmap.c",
    "vendor/core/shared/utils/bh_common.c",
    "vendor/core/shared/utils/bh_hashmap.c",
    "vendor/core/shared/utils/bh_leb128.c",
    "vendor/core/shared/utils/bh_list.c",
    "vendor/core/shared/utils/bh_log.c",
    "vendor/core/shared/utils/bh_queue.c",
    "vendor/core/shared/utils/bh_vector.c",
    "vendor/core/shared/utils/runtime_timer.c",
    "vendor/core/iwasm/common/wasm_application.c",
    "vendor/core/iwasm/common/wasm_blocking_op.c",
    "vendor/core/iwasm/common/wasm_c_api.c",
    "vendor/core/iwasm/common/wasm_exec_env.c",
    "vendor/core/iwasm/common/wasm_loader_common.c",
    "vendor/core/iwasm/common/wasm_memory.c",
    "vendor/core/iwasm/common/wasm_native.c",
    "vendor/core/iwasm/common/wasm_runtime_common.c",
    "vendor/core/iwasm/common/wasm_shared_memory.c",
    "vendor/core/iwasm/interpreter/wasm_interp_classic.c",
    "vendor/core/iwasm/interpreter/wasm_loader.c",
    "vendor/core/iwasm/interpreter/wasm_runtime.c",
    "vendor/core/iwasm/common/gc/gc_common.c",
    "vendor/core/iwasm/common/gc/gc_object.c",
    "vendor/core/iwasm/common/gc/gc_type.c",
    "vendor/core/shared/platform/darwin/platform_init.c",
    "vendor/core/shared/platform/common/memory/mremap.c",
    "vendor/invoke_native.c",
    "glue/*.c",
  ], include = ["vendor/core/iwasm/interpreter", "vendor/core/iwasm/common/gc", "silkjs-simde:", "vendor/core/iwasm/include", "vendor/core/shared/platform/darwin", "vendor/core/shared/platform/include", "vendor/core/shared/mem-alloc", "vendor/core/iwasm/common", "vendor/core/shared/utils", "glue"], flags = ["-std=gnu11", "-O2", "-w", "-DNDEBUG", "-DBH_ENABLE_GC_CORRUPTION_CHECK=0", "-DBH_FREE=wasm_runtime_free", "-DBH_MALLOC=wasm_runtime_malloc", "-DWASM_DISABLE_HW_BOUND_CHECK=1", "-DWASM_DISABLE_STACK_HW_BOUND_CHECK=1", "-DWASM_DISABLE_WAKEUP_BLOCKING_OP=0", "-DWASM_DISABLE_WRITE_GS_BASE=0", "-DWASM_ENABLE_AOT_INTRINSICS=0", "-DWASM_ENABLE_BULK_MEMORY=1", "-DWASM_ENABLE_CUSTOM_NAME_SECTION=1", "-DWASM_ENABLE_EXCE_HANDLING=1", "-DWASM_ENABLE_EXTENDED_CONST_EXPR=1", "-DWASM_ENABLE_FAST_INTERP=0", "-DWASM_ENABLE_GC=1", "-DWASM_ENABLE_INTERP=1", "-DWASM_ENABLE_LOAD_CUSTOM_SECTION=1", "-DWASM_ENABLE_MEMORY64=1", "-DWASM_ENABLE_MINI_LOADER=0", "-DWASM_ENABLE_MULTI_MEMORY=1", "-DWASM_ENABLE_MULTI_MODULE=1", "-DWASM_ENABLE_QUICK_AOT_ENTRY=0", "-DWASM_ENABLE_REF_TYPES=1", "-DWASM_ENABLE_SHARED_MEMORY=1", "-DWASM_ENABLE_SHRUNK_MEMORY=1", "-DWASM_ENABLE_SIMD=1", "-DWASM_ENABLE_SIMDE=1", "-DWASM_ENABLE_TAGS=1", "-DWASM_ENABLE_TAIL_CALL=1", "-DWASM_GLOBAL_HEAP_SIZE=10485760", "-DBH_PLATFORM_DARWIN"], os = "macos" },
]
link = [
  { library = "pthread", mode = "dynamic", os = "linux" },
  { library = "m", mode = "dynamic", os = "linux" },
]

# SIMDe, the headers WAMR's SIMD interpreter builds on; GitHub's archive of the pinned commit.
[native.archive.silkjs-simde]
url = "https://codeload.github.com/simd-everywhere/simde/tar.gz/71fd833d9666141edcd1d3c109a80e228303d8d7"
sha256 = "72b2c14a487560b7eb203795f2c2fead5c7499662e639944cca2a9bb19f09029"
strip = 1
