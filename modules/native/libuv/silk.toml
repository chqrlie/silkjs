[package]
name = "silkjs-libuv"
description = "uvwasi, compiled against a uv.h that the SilkJS runtime implements in Silk; no libuv"
version = "1.51.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["lib"]

# uvwasi/ is uvwasi e76edba (nodejs/uvwasi) with ownership.patch applied: its src/, include/ and
# LICENSE. uvwasi is written against libuv, and no libuv is compiled here: uvwasi/shim/uv.h declares
# the part of libuv 1.51's interface that uvwasi uses, with every function named silk_uvwasi_*, and
# the runtime defines those functions in Silk (modules/runtime/src/ext/uvwasi_host.silk). The
# package keeps its name, and as its version the libuv release whose behavior the functions follow.
